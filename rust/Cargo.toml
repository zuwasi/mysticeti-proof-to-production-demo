[package]
name = "mysticeti-twin"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Deterministic stake-weighted Mysticeti-style research digital twin"
license = "MIT"

[lib]
name = "mysticeti_twin"
path = "src/lib.rs"

[[bin]]
name = "mysticeti-twin"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rand = "0.9"
rand_chacha = "0.9"
rayon = "1.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
criterion = "0.8"
proptest = "1.7"
tempfile = "3"

[[bench]]
name = "simulation"
harness = false
